# CI runs every check that needs no live node: gofmt, go vet, the lab self-test
# (shell syntax, Python compile, Go skeletons FAIL and solutions PASS, Bug Dojo),
# and the offline-library recall tests. Node checkers (./lab.sh check NN) run
# locally against the student's own node; see START_HERE.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          cache: false
      - name: gofmt (no diffs allowed)
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$out" || { echo "$out"; exit 1; }
      - name: go vet all modules
        run: |
          for m in $(git ls-files '*go.mod' | xargs -n1 dirname); do
            echo "vet $m"; go -C "$m" vet ./...
          done
      - name: lab self-test
        run: |
          test -x lab.sh
          ./lab.sh selftest
      - name: offline-library recall tests
        run: go -C offline-library/books test ./...
